<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 · 通关与报告 — AI 闯关学堂原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
/* ============ 设计系统（轻漫画风 · 校园闯关手账） ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#FFF9EC; --paper2:#FBF0D8; --desk:#F2E7CE;
  --ink:#2B2B2B; --ink-soft:#8B8170;
  --pri:#FFB300; --pri-deep:#E29C00; --pri-soft:#FFE9B8;
  --ok:#3DBE6B; --ok-deep:#2C9454; --ok-soft:#E4F7EC;
  --bad:#F04F4F; --bad-deep:#CF3F3F; --bad-soft:#FCE8E8;
  --info:#4A90E2; --info-deep:#3473C4;
  --line:#EFE2C2;
  --skin:#FFE3C0;
}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:var(--ink);
  background:radial-gradient(circle at 1px 1px, rgba(43,43,43,.045) 1px, transparent 0) 0 0/24px 24px, var(--desk);
  min-height:100vh; padding:40px 24px 80px;
}
.font-display{font-family:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif; letter-spacing:.5px}

.file-head{max-width:1280px;margin:0 auto 44px;background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 rgba(43,43,43,.85);padding:26px 30px;position:relative;overflow:hidden}
.file-head::after{content:"";position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;background:repeating-conic-gradient(rgba(255,179,0,.14) 0 8deg, transparent 8deg 16deg)}
.file-head h1{font-size:30px;position:relative;z-index:1}
.file-head .sub{color:var(--ink-soft);font-size:14px;margin-top:6px;position:relative;z-index:1}
.file-head .badge{display:inline-block;font-size:12px;font-weight:700;background:var(--pri);border:2px solid var(--ink);border-radius:8px;padding:2px 10px;margin-right:8px;transform:rotate(-2deg)}
.legend{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:relative;z-index:1}
.legend .dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.legend .sw{width:18px;height:18px;border-radius:6px;border:2px solid var(--ink);display:inline-block}
.legend .note{font-size:12px;color:var(--ink-soft)}

.frames{display:flex;flex-wrap:wrap;gap:56px 48px;justify-content:center;max-width:1420px;margin:0 auto}
.frame-item{width:380px}
.frame-item figcaption{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 rgba(43,43,43,.85);margin-top:18px;padding:14px 16px}
.frame-item figcaption h3{font-size:16px;display:flex;align-items:center;gap:8px}
.frame-item figcaption .no{font-family:"ZCOOL KuaiLe";background:var(--pri);border:2px solid var(--ink);border-radius:8px;width:26px;height:26px;display:inline-grid;place-items:center;font-size:14px;flex:none}
.frame-item figcaption ul{margin:8px 0 0 0;list-style:none}
.frame-item figcaption li{font-size:12.5px;color:var(--ink-soft);padding-left:14px;position:relative;line-height:1.75}
.frame-item figcaption li::before{content:"·";position:absolute;left:2px;font-weight:900;color:var(--pri-deep)}

.phone{width:375px;height:812px;background:var(--paper);border:3.5px solid var(--ink);border-radius:46px;box-shadow:0 18px 40px rgba(43,43,43,.22), inset 0 0 0 3px #fff;margin:0 auto;position:relative;overflow:hidden}
.screen{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.statusbar{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:700}
.sbody{flex:1;overflow:hidden;padding:0 18px 0;position:relative;display:flex;flex-direction:column}

.btn{font-family:inherit;font-size:15px;font-weight:800;border:2px solid var(--ink);border-radius:14px;padding:12px 18px;background:var(--pri);color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.ghost{background:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.big{width:100%;font-size:16px;padding:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;border:1.5px solid var(--ink)}
.say{position:relative;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:9px 12px;box-shadow:0 3px 0 rgba(43,43,43,.85);font-size:12.5px;line-height:1.6;font-weight:600}
.say::before{content:"";position:absolute;left:20px;bottom:-9px;width:13px;height:13px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.say.tail-l::before{left:-8px;top:20px;bottom:auto;border-right:none;border-left:2px solid var(--ink)}
.say b{color:var(--pri-deep)}
.card{background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(43,43,43,.85)}
.sec-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin:16px 2px 10px}
.sec-title::before{content:"";width:8px;height:16px;background:var(--pri);border:2px solid var(--ink);border-radius:3px;transform:rotate(-3deg)}

/* ---------- 吉祥物「闯闯」 ---------- */
.mascot{position:relative;width:86px;height:100px;flex:none}
.mascot .head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:72px;height:64px;background:var(--skin);border:2.5px solid var(--ink);border-radius:50% 50% 46% 46%;z-index:2}
.mascot .hair{position:absolute;background:var(--ink);z-index:3;border-radius:8px}
.mascot .hair.h1{width:15px;height:21px;top:-10px;left:13px;transform:rotate(-20deg)}
.mascot .hair.h2{width:12px;height:16px;top:-8px;left:35px;transform:rotate(14deg)}
.mascot .eye{position:absolute;width:9px;height:11px;background:var(--ink);border-radius:50%;top:27px;z-index:3}
.mascot .eye::after{content:"";position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;top:2px;left:2px}
.mascot .eye.l{left:20px}.mascot .eye.r{right:20px}
.mascot .blush{position:absolute;width:10px;height:5.5px;background:rgba(240,79,79,.35);border-radius:50%;top:39px;z-index:3}
.mascot .blush.l{left:10px}.mascot .blush.r{right:10px}
.mascot .mouth{position:absolute;z-index:3;top:41px;left:50%;transform:translateX(-50%)}
.mascot .mouth.smile{width:20px;height:10px;border:2.5px solid var(--ink);border-top:none;border-radius:0 0 16px 16px}
.mascot .body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:53px;height:33px;background:#fff;border:2.5px solid var(--ink);border-radius:13px 13px 15px 15px;z-index:1}
.mascot .bow{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:19px;height:10px;background:var(--pri);border:2px solid var(--ink);border-radius:5px;z-index:4}
.mascot .bow::after{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:7px;height:5px;background:var(--pri-deep);border:1.5px solid var(--ink);border-radius:3px}
.mascot .arm{display:none;position:absolute;width:14px;height:14px;background:var(--skin);border:2.5px solid var(--ink);border-radius:50%;z-index:2}
.mascot.cheer .arm{display:block;top:63px;animation:bob 1s ease-in-out infinite}
.mascot.cheer .arm.l{left:0}
.mascot.cheer .arm.r{right:0;animation-delay:.15s}
.mascot.cheer .eye{width:11px;height:11px;top:25px}
.mascot.cheer .mouth.smile{width:23px;height:12px;border-width:3px}
.mascot.cheer{animation:hop .9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}60%{transform:translateY(0)}}
@keyframes pop{0%{transform:scale(0) rotate(-14deg)}70%{transform:scale(1.18) rotate(4deg)}100%{transform:scale(1) rotate(0)}}

/* ---------- 3.1 结算 ---------- */
.burst{position:absolute;left:50%;top:230px;transform:translate(-50%,-50%);width:330px;height:330px;border-radius:50%;background:repeating-conic-gradient(rgba(255,179,0,.20) 0 9deg, transparent 9deg 18deg);z-index:0;pointer-events:none}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:4}
.confetti i{position:absolute;top:-16px;width:8px;height:13px;border:1.5px solid var(--ink);border-radius:2px;animation:fall 3s linear infinite}
.confetti i:nth-child(1){left:12%;background:var(--pri);animation-delay:0s}
.confetti i:nth-child(2){left:26%;background:var(--ok);animation-delay:.5s;width:7px;height:7px;border-radius:50%}
.confetti i:nth-child(3){left:40%;background:var(--info);animation-delay:1s}
.confetti i:nth-child(4){left:55%;background:var(--bad);animation-delay:.3s;width:7px;height:7px;border-radius:50%}
.confetti i:nth-child(5){left:68%;background:var(--pri-deep);animation-delay:1.4s}
.confetti i:nth-child(6){left:80%;background:var(--ok);animation-delay:.8s;width:7px;height:7px;border-radius:50%}
.confetti i:nth-child(7){left:92%;background:var(--info);animation-delay:.2s}
.confetti i:nth-child(8){left:7%;background:var(--bad);animation-delay:1.8s;width:7px;height:7px;border-radius:50%}
.confetti i:nth-child(9){left:48%;background:var(--ok);animation-delay:2.2s}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(830px) rotate(540deg)}}
.win-title{font-family:"ZCOOL KuaiLe";font-size:30px;text-align:center;position:relative;z-index:3;margin-top:4px}
.stars{display:flex;justify-content:center;gap:12px;margin-top:12px;position:relative;z-index:3}
.stars svg{width:52px;height:52px;animation:pop .5s cubic-bezier(.34,1.56,.64,1) backwards}
.stars svg:nth-child(1){animation-delay:.1s}
.stars svg:nth-child(2){animation-delay:.25s}
.stars svg:nth-child(3){animation-delay:.4s}
.stat-row{display:flex;gap:10px;margin-top:18px;position:relative;z-index:3}
.stat{flex:1;background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 rgba(43,43,43,.85);text-align:center;padding:12px 4px}
.stat .v{font-family:"ZCOOL KuaiLe";font-size:21px;color:var(--pri-deep)}
.stat .k{font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:2px}

/* ---------- 3.2 报告 ---------- */
.rpt-head{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px}
.rpt-head .t{font-family:"ZCOOL KuaiLe";font-size:20px}
.donut-wrap{display:flex;align-items:center;gap:16px;margin-top:6px}
.donut{width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--ok) 0 80%, var(--line) 80% 100%);border:2.5px solid var(--ink);position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:13px;background:#fff;border-radius:50%;border:2.5px solid var(--ink)}
.donut .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;font-family:"ZCOOL KuaiLe";color:var(--ok-deep)}
.donut .num b{display:block;font-size:26px;font-weight:400;line-height:1}
.donut .num small{display:block;font-size:11px;font-family:"PingFang SC";color:var(--ink-soft);font-weight:700;line-height:1.2;margin-top:3px}
.donut-side .big{font-size:15px;font-weight:900}
.donut-side .sm{font-size:12px;color:var(--ink-soft);line-height:1.7;margin-top:4px}
.three-line{background:var(--pri-soft);border:2px dashed var(--ink);border-radius:14px;padding:11px 13px;margin-top:12px;font-size:12.5px;line-height:1.85;font-weight:600}
.three-line b{color:var(--pri-deep)}
.three-line .no{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--pri);border:1.5px solid var(--ink);font-size:11px;margin-right:5px}
.pt-grid{display:flex;gap:10px;margin-top:12px}
.pt-box{flex:1;border-radius:13px;padding:10px 12px;border:2px solid var(--ink)}
.pt-box h4{font-size:12.5px;display:flex;align-items:center;gap:5px;margin-bottom:7px}
.pt-box ul{list-style:none}
.pt-box li{font-size:11.5px;line-height:1.6;padding-left:12px;position:relative;font-weight:600}
.pt-box li::before{content:"·";position:absolute;left:1px;font-weight:900}
.pt-box.master{background:var(--ok-soft);border-color:var(--ok)}
.pt-box.master h4{color:var(--ok-deep)}
.pt-box.weak{background:var(--bad-soft);border-color:var(--bad)}
.pt-box.weak h4{color:var(--bad-deep)}
.advice{list-style:none;margin-top:6px}
.advice li{font-size:12.5px;font-weight:600;line-height:1.6;padding:7px 10px 7px 26px;position:relative;background:#fff;border:2px solid var(--ink);border-radius:11px;box-shadow:0 2px 0 rgba(43,43,43,.85);margin-bottom:8px}
.advice li::before{content:"!";position:absolute;left:8px;top:7px;width:15px;height:15px;background:var(--info);color:#fff;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900}
.quote-row{display:flex;gap:10px;align-items:flex-start;margin-top:6px;position:relative;z-index:3}
.quote-row .say{flex:1;font-size:13px}
.footer-actions{margin-top:auto;padding:14px 0 6px;display:flex;gap:10px}
.footer-actions .btn{flex:1}

/* ---------- 3.3 分享海报 ---------- */
.poster{position:relative;z-index:3;background:#fff;border:2.5px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 rgba(43,43,43,.85);overflow:hidden;margin-top:10px}
.poster .banner{background:linear-gradient(160deg,#FFC93D,#FFB300 55%,#F5A300);border-bottom:2.5px solid var(--ink);padding:16px 16px 26px;position:relative;overflow:hidden}
.poster .banner::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px, rgba(43,43,43,.08) 1px, transparent 0) 0 0/14px 14px}
.poster .plogo{display:flex;align-items:center;gap:7px;font-family:"ZCOOL KuaiLe";font-size:15px;position:relative;z-index:1}
.poster .plogo .m{width:24px;height:24px;background:#fff;border:2px solid var(--ink);border-radius:7px;display:grid;place-items:center;font-size:13px;transform:rotate(-5deg)}
.poster .ptitle{font-family:"ZCOOL KuaiLe";font-size:24px;text-align:center;margin-top:10px;position:relative;z-index:1}
.poster .ptopic{text-align:center;font-size:13px;font-weight:800;margin-top:6px;position:relative;z-index:1}
.poster .ptopic .tag{background:#fff;border-radius:8px;padding:3px 10px}
.poster .pbody{padding:16px}
.poster .pacc{text-align:center}
.poster .pacc .big{font-family:"ZCOOL KuaiLe";font-size:44px;color:var(--ok-deep);line-height:1.1}
.poster .pacc .lbl{font-size:11.5px;color:var(--ink-soft);font-weight:700}
.poster .pstars{display:flex;justify-content:center;gap:6px;margin:8px 0 12px}
.poster .pstars svg{width:24px;height:24px}
.poster .pmascot{display:flex;align-items:center;justify-content:center;gap:10px}
.poster .pmascot .say{font-size:12px;max-width:210px}
.poster .pfoot{border-top:2.5px solid var(--ink);background:var(--paper2);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.poster .pfoot .app{font-family:"ZCOOL KuaiLe";font-size:15px}
.poster .pfoot .app small{display:block;font-family:"PingFang SC";font-size:11px;color:var(--ink-soft);font-weight:700}
.qr{width:54px;height:54px;border:2px solid var(--ink);border-radius:8px;background:
  repeating-linear-gradient(0deg,#2B2B2B 0 3px,transparent 3px 6px),
  repeating-linear-gradient(90deg,#2B2B2B 0 3px,transparent 3px 6px);position:relative}
.qr i{position:absolute;width:10px;height:10px;border:2px solid var(--ink);background:#fff}
.qr i:nth-child(1){top:3px;left:3px}
.qr i:nth-child(2){top:3px;right:3px}
.qr i:nth-child(3){bottom:3px;left:3px}
.pbtns{display:flex;gap:10px;margin-top:14px;position:relative;z-index:3}
.pbtns .btn{flex:1;font-size:14px}
.tape{position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-2deg);width:72px;height:22px;background:rgba(255,201,61,.85);border:2px solid var(--ink);border-radius:4px;z-index:5}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="file-head">
  <h1 class="font-display"><span class="badge">文件 03</span>通关与报告</h1>
  <p class="sub">核心闭环第三步：闯关结算 → AI 复盘报告 → 分享海报，把「学完有收获」变成看得见的结果。</p>
  <div class="legend">
    <span class="note">要点 →</span>
    <span class="dot"><i class="sw" style="background:#FFB300"></i>庆祝主色 #FFB300</span>
    <span class="dot"><i class="sw" style="background:#3DBE6B"></i>掌握点 #3DBE6B</span>
    <span class="dot"><i class="sw" style="background:#F04F4F"></i>薄弱点 #F04F4F</span>
    <span class="note">｜ 结算像「漫画大结局」：彩带+集中线+星星弹出 · 报告一屏讲清「掌握/薄弱/建议」· 海报可分享可保存</span>
  </div>
</header>

<main class="frames">

  <!-- ============ 3.1 闯关结算 ============ -->
  <figure class="frame-item">
    <div class="phone">
      <div class="screen">
        <div class="statusbar"><span>9:48</span><span style="font-size:11px;color:var(--ink-soft)">光合作用 · 完成</span></div>
        <div class="sbody">
          <div class="burst"></div>
          <div class="confetti"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

          <div style="display:flex;justify-content:center;margin-top:30px;position:relative;z-index:3">
            <div class="mascot cheer">
              <div class="head"><i class="hair h1"></i><i class="hair h2"></i><i class="eye l"></i><i class="eye r"></i><i class="blush l"></i><i class="blush r"></i><i class="mouth smile"></i></div>
              <div class="body"><i class="bow"></i></div>
              <i class="arm l"></i><i class="arm r"></i>
            </div>
          </div>

          <div class="win-title">唰——通关成功！</div>
          <div class="stars">
            <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z" fill="#FFC93D" stroke="#2B2B2B" stroke-width="1.3"/></svg>
            <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z" fill="#FFC93D" stroke="#2B2B2B" stroke-width="1.3"/></svg>
            <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z" fill="#FFC93D" stroke="#2B2B2B" stroke-width="1.3"/></svg>
          </div>
          <div style="text-align:center;font-size:13px;font-weight:800;margin-top:8px;position:relative;z-index:3">「光合作用」5 关全部完成！</div>

          <div class="stat-row">
            <div class="stat"><div class="v">4/5</div><div class="k">答对题数</div></div>
            <div class="stat"><div class="v">3'12"</div><div class="k">用时</div></div>
            <div class="stat"><div class="v">45</div><div class="k">获得⭐</div></div>
          </div>

          <div class="quote-row" style="margin-top:18px">
            <div class="say" style="flex:none;font-size:11.5px;padding:6px 10px">表现超棒！<b>看看你的通关报告吧～</b></div>
          </div>

          <div class="footer-actions" style="flex-direction:column;margin-top:12px">
            <button class="btn big">📊 查看复盘报告</button>
            <button class="btn big ghost">🎮 再闯一关</button>
          </div>
        </div>
      </div>
    </div>
    <figcaption>
      <h3><span class="no">1</span>闯关结算</h3>
      <ul>
        <li>「漫画大结局」式庆祝：纸屑彩带循环飘落 + 黄橙集中线 + 三颗星依次弹出（夸张但不刺眼）</li>
        <li>结算数据只给 3 个核心数：答对数 / 用时 / 得星，小学生也一眼看懂</li>
        <li>主按钮引导看报告（闭环），次按钮「再闯一关」承接连胜冲动</li>
      </ul>
    </figcaption>
  </figure>
