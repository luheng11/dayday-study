<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 · 首页与出题流程 — AI 闯关学堂原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
/* ============ 设计系统（轻漫画风 · 校园闯关手账） ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#FFF9EC; --paper2:#FBF0D8; --desk:#F2E7CE;
  --ink:#2B2B2B; --ink-soft:#8B8170;
  --pri:#FFB300; --pri-deep:#E29C00; --pri-soft:#FFE9B8;
  --ok:#3DBE6B; --ok-deep:#2C9454;
  --bad:#F04F4F; --bad-deep:#CF3F3F;
  --info:#4A90E2; --info-deep:#3473C4;
  --line:#EFE2C2;
  --skin:#FFE3C0;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:var(--ink);
  background:radial-gradient(circle at 1px 1px, rgba(43,43,43,.045) 1px, transparent 0) 0 0/24px 24px, var(--desk);
  min-height:100vh; padding:40px 24px 80px;
}
.font-display{font-family:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif; letter-spacing:.5px}

/* ---------- 文件头 ---------- */
.file-head{max-width:1280px;margin:0 auto 44px;background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 rgba(43,43,43,.85);padding:26px 30px;position:relative;overflow:hidden}
.file-head::after{content:"";position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;background:repeating-conic-gradient(rgba(255,179,0,.14) 0 8deg, transparent 8deg 16deg)}
.file-head h1{font-size:30px;position:relative;z-index:1}
.file-head .sub{color:var(--ink-soft);font-size:14px;margin-top:6px;position:relative;z-index:1}
.file-head .badge{display:inline-block;font-size:12px;font-weight:700;background:var(--pri);border:2px solid var(--ink);border-radius:8px;padding:2px 10px;margin-right:8px;transform:rotate(-2deg)}
.legend{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:relative;z-index:1}
.legend .dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.legend .sw{width:18px;height:18px;border-radius:6px;border:2px solid var(--ink);display:inline-block}
.legend .note{font-size:12px;color:var(--ink-soft)}

/* ---------- 原型陈列：一行三列、响应式 ---------- */
.frames{display:flex;flex-wrap:wrap;gap:56px 48px;justify-content:center;max-width:1420px;margin:0 auto}
.frame-item{width:380px}
.frame-item figcaption{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 rgba(43,43,43,.85);margin-top:18px;padding:14px 16px}
.frame-item figcaption h3{font-size:16px;display:flex;align-items:center;gap:8px}
.frame-item figcaption .no{font-family:"ZCOOL KuaiLe";background:var(--pri);border:2px solid var(--ink);border-radius:8px;width:26px;height:26px;display:inline-grid;place-items:center;font-size:14px;flex:none}
.frame-item figcaption ul{margin:8px 0 0 0;list-style:none}
.frame-item figcaption li{font-size:12.5px;color:var(--ink-soft);padding-left:14px;position:relative;line-height:1.75}
.frame-item figcaption li::before{content:"·";position:absolute;left:2px;font-weight:900;color:var(--pri-deep)}

/* ---------- 手机框 ---------- */
.phone{width:375px;height:812px;background:var(--paper);border:3.5px solid var(--ink);border-radius:46px;box-shadow:0 18px 40px rgba(43,43,43,.22), inset 0 0 0 3px #fff;margin:0 auto;position:relative;overflow:hidden}
.screen{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.statusbar{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:700}
.sbody{flex:1;overflow:hidden;padding:4px 18px 0;position:relative;display:flex;flex-direction:column}

/* ---------- 通用组件 ---------- */
.btn{font-family:inherit;font-size:15px;font-weight:800;border:2px solid var(--ink);border-radius:14px;padding:12px 18px;background:var(--pri);color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.ghost{background:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.big{width:100%;font-size:16px;padding:14px}
.btn.small{padding:8px 14px;font-size:13px;border-radius:11px}
.card{background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(43,43,43,.85)}
.chip{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
.chip.on{background:var(--pri)}
.chip.soft{background:var(--pri-soft);border-radius:10px;font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;border:1.5px solid var(--ink);background:var(--pri-soft)}
.say{position:relative;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;box-shadow:0 3px 0 rgba(43,43,43,.85);font-size:13px;font-weight:600;line-height:1.5}
.say::before{content:"";position:absolute;left:20px;bottom:-9px;width:13px;height:13px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.say b{color:var(--pri-deep)}

/* ---------- 吉祥物「闯闯」 ---------- */
.mascot{position:relative;width:86px;height:102px;flex:none}
.mascot .head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:74px;height:66px;background:var(--skin);border:2.5px solid var(--ink);border-radius:50% 50% 46% 46%;z-index:2}
.mascot .hair{position:absolute;background:var(--ink);z-index:3;border-radius:8px}
.mascot .hair.h1{width:15px;height:22px;top:-10px;left:13px;transform:rotate(-20deg)}
.mascot .hair.h2{width:12px;height:17px;top:-8px;left:36px;transform:rotate(14deg)}
.mascot .eye{position:absolute;width:9px;height:11px;background:var(--ink);border-radius:50%;top:28px;z-index:3}
.mascot .eye::after{content:"";position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;top:2px;left:2px}
.mascot .eye.l{left:21px}.mascot .eye.r{right:21px}
.mascot .blush{position:absolute;width:11px;height:6px;background:rgba(240,79,79,.35);border-radius:50%;top:40px;z-index:3}
.mascot .blush.l{left:11px}.mascot .blush.r{right:11px}
.mascot .mouth{position:absolute;z-index:3;top:42px;left:50%;transform:translateX(-50%)}
.mascot .mouth.smile{width:18px;height:9px;border:2.5px solid var(--ink);border-top:none;border-radius:0 0 16px 16px}
.mascot .mouth.sad{width:18px;height:9px;border:2.5px solid var(--ink);border-bottom:none;border-radius:16px 16px 0 0;top:48px}
.mascot .mouth.o{width:13px;height:13px;background:var(--ink);border-radius:50%;top:44px}
.mascot .tear{display:none;position:absolute;width:7px;height:9px;background:var(--info);border:1.5px solid var(--ink);border-radius:50% 50% 60% 60%;top:46px;right:19px;z-index:4}
.mascot.sad .tear{display:block}
.mascot .body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:54px;height:34px;background:#fff;border:2.5px solid var(--ink);border-radius:14px 14px 16px 16px;z-index:1}
.mascot .bow{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:20px;height:11px;background:var(--pri);border:2px solid var(--ink);border-radius:6px;z-index:4}
.mascot .bow::after{content:"";position:absolute;left:50%;top:1px;transform:translateX(-50%);width:7px;height:5px;background:var(--pri-deep);border:1.5px solid var(--ink);border-radius:3px}
.mascot .arm{display:none;position:absolute;width:14px;height:14px;background:var(--skin);border:2.5px solid var(--ink);border-radius:50%;z-index:2}
.mascot.cheer .arm{display:block;top:64px}
.mascot.cheer .arm.l{left:2px;animation:bob 1s ease-in-out infinite}
.mascot.cheer .arm.r{right:2px;animation:bob 1s ease-in-out infinite .15s}
.mascot.cheer .eye{width:11px;height:11px;top:26px}
.mascot.cheer .mouth.smile{width:22px;height:12px;border-width:3px}
.mascot.think .eye{width:7px;height:7px;top:26px}
.mascot.think .eye.l{left:20px}.mascot.think .eye.r{right:27px}
.mascot.think .mouth.o{width:10px;height:10px;top:42px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.floaty{animation:floaty 2.6s ease-in-out infinite}

/* ---------- 顶部导航 / 底栏 ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px}
.logo{display:flex;align-items:center;gap:8px;font-family:"ZCOOL KuaiLe";font-size:21px}
.logo .m{width:34px;height:34px;background:var(--pri);border:2px solid var(--ink);border-radius:10px;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 0 var(--ink);transform:rotate(-4deg)}
.xpchip{display:flex;align-items:center;gap:5px;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;box-shadow:0 2px 0 rgba(43,43,43,.85)}
.tabbar{flex:none;border-top:2.5px solid var(--ink);background:var(--paper2);display:flex;padding:8px 6px 18px;border-radius:0;position:relative;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink-soft);font-weight:700}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.tab.on svg{fill:var(--pri);stroke:var(--ink)}
.tab.on span{color:var(--ink)}
.tab .dotmark{height:4px;width:4px;border-radius:50%;background:transparent}
.tab.on .dotmark{background:var(--pri-deep)}

/* ---------- 屏幕 1：首页 ---------- */
.hero{position:relative;margin-top:2px}
.hero .card{background:#fff;padding:14px 14px 10px;display:flex;gap:12px;align-items:center;position:relative;z-index:1}
.hero .greet{font-size:15px;font-weight:800;margin-bottom:4px}
.hero .greet em{font-style:normal;color:var(--pri-deep)}
.hero .say{font-size:12px}
.sect-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin:12px 2px 8px}
.hero .mascot-box{width:66px;height:78px;position:relative;flex:none}
.hero .mascot-box .mascot{position:absolute;left:0;top:0;transform:scale(.76);transform-origin:top left}
.sect-title::before{content:"";width:8px;height:16px;background:var(--pri);border:2px solid var(--ink);border-radius:3px;transform:rotate(-3deg)}
.input-card{margin-top:12px;background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(43,43,43,.85);padding:12px}
.input-card.focus{border-color:var(--pri-deep);box-shadow:0 0 0 3px var(--pri-soft),0 4px 0 var(--ink)}
.input-card textarea{width:100%;border:none;outline:none;resize:none;font-family:inherit;font-size:14.5px;line-height:1.6;background:transparent;min-height:58px}
.input-card textarea::placeholder{color:#C0B79F}
.input-meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:var(--ink-soft);font-size:11px}
.example-card{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 rgba(43,43,43,.85);padding:8px 12px;margin-bottom:6px}
.example-card .ic{width:36px;height:36px;border:2px solid var(--ink);border-radius:11px;display:grid;place-items:center;flex:none}
.example-card .ic svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.example-card .t{font-size:13.5px;font-weight:800}
.example-card .d{font-size:11px;color:var(--ink-soft);margin-top:2px}
.example-card .go{margin-left:auto;font-size:11px;font-weight:800;color:var(--pri-deep)}
.history{display:flex;align-items:center;gap:10px;background:#fff;border:2px dashed var(--ink-soft);border-radius:12px;padding:8px 12px;font-size:12px}
.history .t{font-weight:800}
.history .meta{margin-left:auto;color:var(--ink-soft);font-size:11px}
.history .acc{color:var(--ok-deep);font-weight:800}

/* ---------- 屏幕 2：输入态 ---------- */
.optrow{display:flex;gap:10px;margin-top:14px}
.optrow .chip{flex:1;justify-content:center;padding:8px 0}
.settings{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 6px;font-size:12.5px;font-weight:700}
.segcount{display:flex;gap:6px}
.segcount .n{width:30px;height:30px;border:2px solid var(--ink);border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;background:#fff}
.segcount .n.on{background:var(--pri)}
.diff{display:flex;gap:6px}
.diff .d{width:34px;height:30px;border:2px solid var(--ink);border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;background:#fff;color:var(--ink-soft)}
.diff .d.on{background:var(--pri);color:var(--ink)}
.hint{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:10px}

/* ---------- 屏幕 3：生成中 ---------- */
.loading{display:flex;flex-direction:column;align-items:center;padding-top:66px;position:relative;z-index:1}
.burst{position:absolute;left:50%;top:250px;transform:translate(-50%,-50%);width:300px;height:300px;border-radius:50%;background:repeating-conic-gradient(rgba(255,179,0,.16) 0 9deg, transparent 9deg 18deg);z-index:0;animation:spin 22s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.steps{width:100%;margin-top:26px;display:flex;flex-direction:column;gap:12px}
.step{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:700;padding:10px 14px;border-radius:12px}
.step.done{background:rgba(61,190,107,.12);border:2px dashed var(--ok)}
.step.doing{background:#fff;border:2px solid var(--ink);box-shadow:0 3px 0 rgba(43,43,43,.85)}
.step.todo{background:transparent;border:2px dashed var(--line);color:var(--ink-soft)}
.step .st{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;flex:none;background:#fff;font-size:11px;font-weight:900}
.step.done .st{background:var(--ok);color:#fff}
.step.doing .st{border-style:dashed;animation:rot 2s linear infinite}
.step.doing .st::after{content:"";width:8px;height:8px;border:2px solid var(--ink);border-top-color:transparent;border-radius:50%}
@keyframes rot{to{transform:rotate(360deg)}}
.progress{margin-top:22px;width:100%;height:14px;border:2px solid var(--ink);border-radius:9px;background:#fff;overflow:hidden}
.progress i{display:block;height:100%;width:64%;background:repeating-linear-gradient(-45deg,var(--pri) 0 8px,#FFC93D 8px 16px);animation:loadingbar 1.6s ease-in-out infinite}
@keyframes loadingbar{0%,100%{width:56%}50%{width:78%}}
.tips{margin-top:18px;text-align:center;font-size:12px;color:var(--ink-soft);background:var(--paper2);border:2px dashed var(--line);border-radius:10px;padding:8px 12px;width:100%}
.thought{display:flex;gap:5px;align-items:center;margin-bottom:4px}
.thought i{width:7px;height:7px;background:var(--ink-soft);border-radius:50%;animation:bob 1s ease-in-out infinite}
.thought i:nth-child(2){animation-delay:.15s;width:9px;height:9px}
.thought i:nth-child(3){animation-delay:.3s;width:11px;height:11px}

/* ---------- 屏幕 4：失败 ---------- */
.errbox{text-align:center;margin-top:20px;padding:20px 18px}
.errbox .title{font-family:"ZCOOL KuaiLe";font-size:21px;margin:12px 0 6px}
.errbox .desc{font-size:12.5px;color:var(--ink-soft);line-height:1.7}
.err-btns{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.retrytip{display:flex;gap:8px;align-items:flex-start;background:var(--pri-soft);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:11.5px;line-height:1.6;margin-top:16px}
.retrytip b{flex:none}
.crack{position:absolute;top:56px;right:56px;font-size:26px;font-weight:900;color:var(--bad);transform:rotate(12deg);z-index:2}
.squig{position:absolute;width:44px;height:6px;border-top:2.5px solid var(--bad);border-radius:50%;transform:rotate(-8deg)}

/* 动效尊重系统偏好 */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="file-head">
  <h1 class="font-display"><span class="badge">文件 01</span>首页与出题流程</h1>
  <p class="sub">核心闭环第一步：想学什么 → AI 出题。覆盖首页默认、输入态、AI 生成中、失败重试 4 个关键状态。</p>
  <div class="legend">
    <span class="note">设计令牌 →</span>
    <span class="dot"><i class="sw" style="background:#FFB300"></i>阿衰黄橙 #FFB300</span>
    <span class="dot"><i class="sw" style="background:#2B2B2B"></i>漫画墨黑 #2B2B2B</span>
    <span class="dot"><i class="sw" style="background:#FFF9EC"></i>漫画纸白 #FFF9EC</span>
    <span class="dot"><i class="sw" style="background:#3DBE6B"></i>答对绿 #3DBE6B</span>
    <span class="dot"><i class="sw" style="background:#F04F4F"></i>答错红 #F04F4F</span>
    <span class="note">｜ 标题 ZCOOL 快乐体 · 正文系统黑体 · 按钮粗描边+硬底阴影（按压感）· 卡片像手绘漫画格</span>
  </div>
</header>

<main class="frames">

  <!-- ============ 1.1 首页 · 默认 ============ -->
  <figure class="frame-item">
    <div class="phone">
      <div class="screen">
        <div class="statusbar"><span>9:41</span>
          <span style="font-size:11px;color:var(--ink-soft)">闯关学堂</span>
        </div>
        <div class="sbody">
          <div class="topbar">
            <div class="logo"><span class="m">闯</span>闯关学堂</div>
            <div class="xpchip"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z" fill="#FFB300" stroke="#2B2B2B" stroke-width="1.4"/></svg> 成长值 88</div>
          </div>

          <div class="hero">
            <div class="card">
              <div class="mascot-box floaty">
                <div class="mascot">
                  <div class="head"><i class="hair h1"></i><i class="hair h2"></i><i class="eye l"></i><i class="eye r"></i><i class="blush l"></i><i class="blush r"></i><i class="mouth smile"></i><i class="tear"></i></div>
                  <div class="body"><i class="bow"></i></div>
                  <i class="arm l"></i><i class="arm r"></i>
                </div>
              </div>
              <div>
                <div class="greet">早上好，<em>小闯同学</em>！👋</div>
                <div class="say">今天想学点什么？<b>我来帮你出题闯关！</b></div>
              </div>
            </div>
          </div>

          <div class="sect-title">输入想学的知识</div>
          <div class="input-card">
            <textarea placeholder="一句话、一段课文、甚至一个主题都行，比如：光合作用是怎么进行的？"></textarea>
            <div class="input-meta"><span class="chip soft">✨ 主题</span><span class="chip soft">📋 粘贴文本</span><span>0 / 200</span></div>
          </div>
          <div style="margin-top:10px"><button class="btn big">🔍 一键生成闯关</button></div>

          <div class="sect-title">试试这些 <span style="font-size:11px;color:var(--ink-soft);font-weight:600">适合中小学生的示例主题</span></div>
          <div class="example-card">
            <span class="ic" style="background:#FFF3C2"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></span>
            <div><div class="t">光合作用</div><div class="d">植物是怎么「吃饭」的？</div></div>
            <span class="go">5 关 →</span>
          </div>
          <div class="example-card">
            <span class="ic" style="background:#FFE1D6"><svg viewBox="0 0 24 24"><path d="M3 21h12l6-12H9L3 21z"/><path d="M9 9l4-3 3 5M10 12l3-2M13 8l2 1"/></svg></span>
            <div><div class="t">火山为什么会喷发</div><div class="d">地球内部的能量</div></div>
            <span class="go">5 关 →</span>
