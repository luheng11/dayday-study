<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05 · 扩展功能预览 — AI 闯关学堂原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
/* ============ 设计系统（轻漫画风 · 校园闯关手账） ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#FFF9EC; --paper2:#FBF0D8; --desk:#F2E7CE;
  --ink:#2B2B2B; --ink-soft:#8B8170;
  --pri:#FFB300; --pri-deep:#E29C00; --pri-soft:#FFE9B8;
  --ok:#3DBE6B; --ok-deep:#2C9454; --ok-soft:#E4F7EC;
  --bad:#F04F4F; --bad-deep:#CF3F3F; --bad-soft:#FCE8E8;
  --info:#4A90E2; --info-deep:#3473C4; --info-soft:#E4F0FF;
  --vio:#8E6FE8; --vio-deep:#6E52C4; --vio-soft:#EFE9FF;
  --line:#EFE2C2;
  --skin:#FFE3C0;
}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:var(--ink);
  background:radial-gradient(circle at 1px 1px, rgba(43,43,43,.045) 1px, transparent 0) 0 0/24px 24px, var(--desk);
  min-height:100vh; padding:40px 24px 80px;
}
.font-display{font-family:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif; letter-spacing:.5px}

.file-head{max-width:1280px;margin:0 auto 44px;background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 rgba(43,43,43,.85);padding:26px 30px;position:relative;overflow:hidden}
.file-head::after{content:"";position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;background:repeating-conic-gradient(rgba(142,111,232,.12) 0 8deg, transparent 8deg 16deg)}
.file-head h1{font-size:30px;position:relative;z-index:1}
.file-head .sub{color:var(--ink-soft);font-size:14px;margin-top:6px;position:relative;z-index:1}
.file-head .badge{display:inline-block;font-size:12px;font-weight:700;background:var(--vio);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:2px 10px;margin-right:8px;transform:rotate(-2deg)}
.legend{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:relative;z-index:1}
.legend .dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.legend .sw{width:18px;height:18px;border-radius:6px;border:2px solid var(--ink);display:inline-block}
.legend .note{font-size:12px;color:var(--ink-soft)}

.frames{display:flex;flex-wrap:wrap;gap:56px 48px;justify-content:center;max-width:1420px;margin:0 auto}
.frame-item{width:380px}
.frame-item figcaption{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 rgba(43,43,43,.85);margin-top:18px;padding:14px 16px}
.frame-item figcaption h3{font-size:16px;display:flex;align-items:center;gap:8px}
.frame-item figcaption .no{font-family:"ZCOOL KuaiLe";background:var(--vio);color:#fff;border:2px solid var(--ink);border-radius:8px;width:26px;height:26px;display:inline-grid;place-items:center;font-size:14px;flex:none}
.frame-item figcaption ul{margin:8px 0 0 0;list-style:none}
.frame-item figcaption li{font-size:12.5px;color:var(--ink-soft);padding-left:14px;position:relative;line-height:1.75}
.frame-item figcaption li::before{content:"·";position:absolute;left:2px;font-weight:900;color:var(--vio-deep)}

.phone{width:375px;height:812px;background:var(--paper);border:3.5px solid var(--ink);border-radius:46px;box-shadow:0 18px 40px rgba(43,43,43,.22), inset 0 0 0 3px #fff;margin:0 auto;position:relative;overflow:hidden}
.screen{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.statusbar{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:700}
.sbody{flex:1;overflow:hidden;padding:0 18px 0;position:relative;display:flex;flex-direction:column}

.btn{font-family:inherit;font-size:14px;font-weight:800;border:2px solid var(--ink);border-radius:13px;padding:11px 16px;background:var(--pri);color:var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:#fff}
.btn.big{width:100%;font-size:15.5px;padding:14px}
.card{background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(43,43,43,.85)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;border:1.5px solid var(--ink)}
.sec-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin:16px 2px 10px}
.sec-title::before{content:"";width:8px;height:16px;background:var(--vio);border:2px solid var(--ink);border-radius:3px;transform:rotate(-3deg)}

/* 后续版本缎带 */
.v2-ribbon{position:absolute;top:16px;left:-42px;transform:rotate(-45deg);background:var(--vio);color:#fff;padding:5px 46px;font-size:10.5px;font-weight:800;border:2px solid var(--ink);z-index:40;letter-spacing:1px}
.v2-chip{display:inline-flex;align-items:center;gap:4px;background:var(--vio-soft);border:1.5px solid var(--vio);color:var(--vio-deep);border-radius:7px;font-size:10.5px;font-weight:800;padding:2px 8px}

/* ---------- 吉祥物「闯闯」 ---------- */
.mascot{position:relative;width:86px;height:100px;flex:none}
.mascot .head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:72px;height:64px;background:var(--skin);border:2.5px solid var(--ink);border-radius:50% 50% 46% 46%;z-index:2}
.mascot .hair{position:absolute;background:var(--ink);z-index:3;border-radius:8px}
.mascot .hair.h1{width:15px;height:21px;top:-10px;left:13px;transform:rotate(-20deg)}
.mascot .hair.h2{width:12px;height:16px;top:-8px;left:35px;transform:rotate(14deg)}
.mascot .eye{position:absolute;width:9px;height:11px;background:var(--ink);border-radius:50%;top:27px;z-index:3}
.mascot .eye::after{content:"";position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;top:2px;left:2px}
.mascot .eye.l{left:20px}.mascot .eye.r{right:20px}
.mascot .blush{position:absolute;width:10px;height:5.5px;background:rgba(240,79,79,.35);border-radius:50%;top:39px;z-index:3}
.mascot .blush.l{left:10px}.mascot .blush.r{right:10px}
.mascot .mouth{position:absolute;z-index:3;top:41px;left:50%;transform:translateX(-50%);width:20px;height:10px;border:2.5px solid var(--ink);border-top:none;border-radius:0 0 16px 16px}
.mascot .body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:53px;height:33px;background:#fff;border:2.5px solid var(--ink);border-radius:13px 13px 15px 15px;z-index:1}
.mascot .bow{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:19px;height:10px;background:var(--pri);border:2px solid var(--ink);border-radius:5px;z-index:4}
.mascot .bow::after{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:7px;height:5px;background:var(--pri-deep);border:1.5px solid var(--ink);border-radius:3px}
.mascot .arm{display:none;position:absolute;width:14px;height:14px;background:var(--skin);border:2.5px solid var(--ink);border-radius:50%;z-index:2}
.mascot.cheer .arm{display:block;top:63px;animation:bob 1s ease-in-out infinite}
.mascot.cheer .arm.l{left:0}
.mascot.cheer .arm.r{right:0;animation-delay:.15s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.floaty{animation:floaty 2.6s ease-in-out infinite}

/* ---------- 5.1 RAG 知识库 ---------- */
.upload{border:2.5px dashed var(--ink-soft);border-radius:16px;background:var(--paper2);padding:26px 16px;text-align:center;margin-top:12px}
.upload .cloud{width:52px;height:52px;border:2px solid var(--ink);border-radius:14px;background:#fff;display:grid;place-items:center;margin:0 auto 10px;box-shadow:0 3px 0 rgba(43,43,43,.85)}
.upload .t1{font-weight:900;font-size:14px}
.upload .t2{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:4px}
.formats{display:flex;justify-content:center;gap:8px;margin-top:12px}
.formats .tag{background:#fff;font-size:10.5px}
.kb-item{display:flex;align-items:center;gap:11px;background:#fff;border:2px solid var(--ink);border-radius:13px;box-shadow:0 3px 0 rgba(43,43,43,.85);padding:11px 12px;margin-top:11px}
.kb-item .ic{width:38px;height:38px;border:2px solid var(--ink);border-radius:11px;display:grid;place-items:center;flex:none;background:var(--info-soft)}
.kb-item .t{font-size:13px;font-weight:800}
.kb-item .d{font-size:10.5px;color:var(--ink-soft);font-weight:600;margin-top:2px}
.kb-item .go{margin-left:auto;font-size:11px;font-weight:800;color:var(--vio-deep)}
.footer-actions{margin-top:auto;padding:16px 0 6px}

/* ---------- 5.2 AI 生图题 ---------- */
.picwrap{display:flex;justify-content:center;margin:16px 0 4px}
.picframe{background:#fff;border:2.5px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 rgba(43,43,43,.85);padding:14px;position:relative}
.picframe .ai-tag{position:absolute;top:-11px;right:10px;background:var(--vio);color:#fff;border:2px solid var(--ink);border-radius:8px;font-size:10.5px;font-weight:800;padding:2px 8px;transform:rotate(3deg)}
.picframe svg{display:block}
.piccap{text-align:center;font-size:11.5px;color:var(--ink-soft);font-weight:700;margin-top:8px}
.opt-row{display:flex;gap:10px;margin-top:14px}
.opt-pic{flex:1;background:#fff;border:2px solid var(--ink);border-radius:13px;box-shadow:0 3px 0 rgba(43,43,43,.85);text-align:center;padding:10px 4px}
.opt-pic .k{display:block;font-size:10.5px;font-weight:900;color:var(--ink-soft)}
.opt-pic .w{display:block;font-family:"ZCOOL KuaiLe";font-size:18px;margin-top:2px}
.opt-pic.pick{background:var(--ok-soft);border-color:var(--ok);box-shadow:0 3px 0 var(--ok-deep)}
.opt-pic.pick .w{color:var(--ok-deep)}

/* ---------- 5.3 VIP ---------- */
.vip-card{margin-top:14px;background:linear-gradient(150deg,#FFD977,#FFB300 55%,#F0A500);border:2.5px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 rgba(43,43,43,.85);padding:18px 16px;position:relative;overflow:hidden}
.vip-card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px, rgba(255,255,255,.28) 1px, transparent 0) 0 0/13px 13px;pointer-events:none}
.vip-card .vrow{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.vip-card .crown{width:52px;height:52px;border:2.5px solid var(--ink);border-radius:15px;background:#fff;display:grid;place-items:center;flex:none;transform:rotate(-4deg)}
.vip-card .vt{font-family:"ZCOOL KuaiLe";font-size:20px}
.vip-card .vd{font-size:11px;font-weight:700;opacity:.75;margin-top:3px}
.benefits{margin-top:14px;background:#fff;border:2px solid var(--ink);border-radius:15px;box-shadow:0 3px 0 rgba(43,43,43,.85);padding:13px 14px}
.benefits li{list-style:none;display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;padding:7px 0;border-bottom:1.5px dashed var(--line)}
.benefits li:last-child{border-bottom:none}
.benefits .ck{width:19px;height:19px;border-radius:50%;background:var(--ok);color:#fff;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:10.5px;font-weight:900;flex:none}
.plans{display:flex;gap:11px;margin-top:14px}
.plan{flex:1;background:#fff;border:2px solid var(--ink);border-radius:15px;box-shadow:0 3px 0 rgba(43,43,43,.85);padding:13px 10px;text-align:center;position:relative}
.plan .pt{font-size:12px;font-weight:900;color:var(--ink-soft)}
.plan .pp{font-family:"ZCOOL KuaiLe";font-size:24px;margin-top:4px}
.plan .pp small{font-size:11px;font-family:"PingFang SC";font-weight:700;color:var(--ink-soft)}
.plan .ps{font-size:10.5px;color:var(--ink-soft);font-weight:700;margin-top:3px}
.plan.hot{border-width:2.5px;background:var(--pri-soft)}
.plan .hot-tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-2deg);background:var(--bad);color:#fff;border:2px solid var(--ink);border-radius:8px;font-size:10.5px;font-weight:800;padding:1px 9px;white-space:nowrap}

/* ---------- 5.4 PK / 排行榜 ---------- */
.vs-head{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
.plyr{text-align:center}
.plyr .pa{width:58px;height:58px;border-radius:50%;border:2.5px solid var(--ink);background:var(--skin);margin:0 auto;position:relative;overflow:hidden;box-shadow:0 3px 0 rgba(43,43,43,.85)}
.plyr .pa.me{background:#FFE3C0}
.plyr .pa.op{background:#C9E6FF}
.plyr .pa .f{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:44px;height:22px;background:var(--ink);border-radius:0 0 14px 14px}
.plyr .pa .ee{position:absolute;width:6px;height:7px;background:var(--ink);border-radius:50%;top:26px}
.plyr .pa .ee.l{left:14px}.plyr .pa .ee.r{right:14px}
.plyr .pa .mm{position:absolute;top:33px;left:50%;transform:translateX(-50%);width:11px;height:6px;border:2px solid var(--ink);border-top:none;border-radius:0 0 8px 8px}
.plyr .pn{font-size:12px;font-weight:900;margin-top:7px}
.plyr .ps{font-family:"ZCOOL KuaiLe";font-size:24px;margin-top:2px}
.vs-badge{font-family:"ZCOOL KuaiLe";font-size:22px;background:var(--pri);border:2.5px solid var(--ink);border-radius:50%;width:54px;height:54px;display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);transform:rotate(-6deg);flex:none}
.pkvote{display:flex;align-items:center;gap:10px;margin-top:16px}
.pk-bar{flex:1;height:22px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden;display:flex}
.pk-bar .a{width:40%;background:repeating-linear-gradient(-45deg,var(--ok) 0 6px,#54CE85 6px 12px)}
.pk-bar .b{width:60%;background:repeating-linear-gradient(-45deg,var(--bad) 0 6px,#FF7A7A 6px 12px)}
.pk-q{display:flex;gap:8px;align-items:center;margin-top:14px;background:#fff;border:2px solid var(--ink);border-radius:13px;box-shadow:0 3px 0 rgba(43,43,43,.85);padding:11px 13px}
.pk-q .timer{margin-left:auto;flex:none;font-family:"ZCOOL KuaiLe";font-size:17px;color:var(--bad-deep);background:var(--bad-soft);border:1.5px solid var(--bad);border-radius:9px;padding:2px 9px}
.board{margin-top:14px;background:#fff;border:2px solid var(--ink);border-radius:15px;box-shadow:0 3px 0 rgba(43,43,43,.85);padding:12px 13px}
.board h4{font-size:13px;font-weight:900;margin-bottom:9px}
.brow{display:flex;align-items:center;gap:9px;padding:6.5px 0;border-bottom:1.5px dashed var(--line);font-size:12.5px;font-weight:700}
.brow:last-child{border-bottom:none}
.brow .rk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff;border:1.5px solid var(--ink);flex:none}
.brow .rk.r1{background:var(--pri)}
.brow .rk.r2{background:#B9C2CC}
.brow .rk.r3{background:#D9975B}
.brow .rk.rn{background:#fff;color:var(--ink-soft)}
.brow .me-tag{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--vio-deep);background:var(--vio-soft);border:1.5px solid var(--vio);border-radius:6px;padding:1px 6px}

/* ---------- 5.5 数字人助教 ---------- */
.helper-stage{display:flex;flex-direction:column;align-items:center;margin-top:16px;position:relative}
.halo{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:150px;height:150px;border-radius:50%;background:radial-gradient(circle, rgba(142,111,232,.16) 0, transparent 68%);z-index:0}
.halo::before{content:"";position:absolute;inset:0;border-radius:50%;border:2.5px dashed var(--vio);opacity:.5;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.helper-stage .mascot{position:relative;z-index:1}
.wave{display:flex;gap:4px;align-items:center;justify-content:center;height:26px;margin-top:12px}
.wave i{width:5px;border-radius:3px;background:var(--vio);border:1.5px solid var(--ink);animation:wv 1s ease-in-out infinite}
.wave i:nth-child(1){height:10px}.wave i:nth-child(2){height:20px;animation-delay:.1s}
.wave i:nth-child(3){height:26px;animation-delay:.2s}.wave i:nth-child(4){height:16px;animation-delay:.3s}
.wave i:nth-child(5){height:22px;animation-delay:.15s}.wave i:nth-child(6){height:12px;animation-delay:.25s}
.wave i:nth-child(7){height:18px;animation-delay:.35s}
@keyframes wv{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.hear-q{background:#fff;border:2px solid var(--ink);border-radius:15px;box-shadow:0 3px 0 rgba(43,43,43,.85);padding:13px 15px;margin-top:14px;text-align:center}
.hear-q .lbl{font-size:11px;font-weight:800;color:var(--vio-deep);background:var(--vio-soft);border:1.5px solid var(--vio);border-radius:7px;padding:2px 9px;display:inline-block;margin-bottom:8px}
.hear-q .q{font-size:15px;font-weight:900;line-height:1.55}
.hear-acts{display:flex;gap:10px;margin-top:14px}
.hear-acts .btn{flex:1}
.hear-acts .btn.mic{background:var(--vio);color:#fff;flex:none;width:52px;padding:11px 0}
.caption{text-align:center;font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:12px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="file-head">
  <h1 class="font-display"><span class="badge">文件 05 · 后续版本</span>扩展功能预览</h1>
  <p class="sub">需求文档 4.2 记录的五个后续方向：RAG 知识库、AI 生图题、VIP 会员、多人 PK/排行榜、数字人助教。本文件仅做视觉前瞻，均标注「V2 前瞻」，不进入 MVP 首版开发。</p>
  <div class="legend">
    <span class="note">要点 →</span>
    <span class="dot"><i class="sw" style="background:#8E6FE8"></i>前瞻紫 #8E6FE8（区别于 MVP 主色）</span>
    <span class="dot"><i class="sw" style="background:#FFB300"></i>主色 #FFB300</span>
    <span class="dot"><i class="sw" style="background:#3DBE6B"></i>答对 #3DBE6B</span>
    <span class="dot"><i class="sw" style="background:#F04F4F"></i>答错 #F04F4F</span>
    <span class="note">｜ 每帧左上角斜向「V2 前瞻」缎带，视觉语言仍完全沿用 MVP 设计系统，保证未来迭代不换皮</span>
  </div>
</header>

<main class="frames">

  <!-- ============ 5.1 RAG 知识库 ============ -->
  <figure class="frame-item">
    <div class="phone">
      <span class="v2-ribbon">V2 前瞻</span>
      <div class="screen">
        <div class="statusbar"><span>9:53</span><span style="font-size:11px;color:var(--ink-soft)">知识库 · 后续版本</span></div>
        <div class="sbody">
          <div class="sec-title" style="margin-top:8px">📚 知识库出题 <span class="v2-chip">V2 前瞻</span></div>
          <p style="font-size:12px;color:var(--ink-soft);font-weight:600;line-height:1.7">上传你的课文、笔记、试卷或资料，AI 基于你的专属知识库出题，考前复习更精准。</p>

          <div class="upload">
            <div class="cloud"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17a4.5 4.5 0 1 1 .8-8.9A6 6 0 0 1 19 9.5 4 4 0 0 1 18 17H7z"/><path d="M12 12v6M9.5 15l2.5-2.5L14.5 15"/></svg></div>
            <div class="t1">点击上传或拖拽文件到这里</div>
            <div class="t2">支持 PDF · Word · PPT · 网页链接</div>
          </div>

          <div class="formats"><span class="tag">📄 PDF</span><span class="tag">📝 Word</span><span class="tag">📊 PPT</span><span class="tag">🔗 网页</span></div>

          <div class="sec-title">我的资料库</div>
          <div class="kb-item">
            <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>
